[project]
name = "radiology-rag-lab"
version = "0.1.0"
description = "Laboratorio educativo reproducible de RAG sobre fuentes radiológicas versionadas"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "pypdf>=6,<8",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "tokenizers>=0.22,<1",
  "numpy>=2,<3",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=5,<6",
  "torch==2.14.1",
  "transformers>=5,<6",
  "psutil>=7,<8",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
radiology-rag = "radiology_rag.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiology_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", "tmp", "output", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
