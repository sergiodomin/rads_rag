name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_publish.py --tracked
